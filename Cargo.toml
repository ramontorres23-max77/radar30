[package]
name = "radar30"
version = "0.3.0"
edition = "2024"
description = "Multi-source, engagement-scored research engine for the last 30 days — single-binary Rust CLI, stdio MCP server, and Agent Skill"
license = "MIT"
readme = "README.md"
rust-version = "1.97"
keywords = ["research", "mcp", "cli", "search", "aggregation"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
regex = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
toml_edit = "0.25"
ureq = { version = "3", features = ["json", "gzip"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
